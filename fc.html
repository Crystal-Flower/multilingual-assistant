<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amrita University Faculty Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
        
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .faculty-card {
            transition: transform 0.3s ease, opacity 0.5s ease;
        }
        .faculty-card-hidden {
            display: none;
            opacity: 0;
        }
    </style>
</head>
<body class="p-6 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-2">Amrita University Faculty</h1>
            <p class="text-lg text-gray-600">A directory of faculty members from the School of Computing.</p>
        </header>

        <!-- Search and Filter Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <div class="mb-6">
                <label for="search-input" class="block text-gray-700 font-semibold mb-2">Search Faculty</label>
                <input type="text" id="search-input" placeholder="Search by name, department, or designation..." class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200">
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex-1">
                    <label for="department-select" class="block text-gray-700 font-semibold mb-2">Filter by Department</label>
                    <select id="department-select" class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200 cursor-pointer">
                        <option value="all" selected>All Departments</option>
                        <!-- Department options will be dynamically inserted here -->
                    </select>
                </div>
                <div class="text-sm text-gray-500 mt-auto pt-4 sm:pt-0" id="faculty-count"></div>
            </div>
        </div>

        <div id="loading" class="text-center py-12">
            <div class="flex items-center justify-center">
                <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500"></div>
            </div>
            <p class="mt-4 text-lg text-gray-500">Scraping faculty data, please wait...</p>
        </div>

        <div id="faculty-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Faculty cards will be dynamically inserted here -->
        </div>

        <div id="error-message" class="hidden text-center text-red-500 mt-12">
            <p class="text-xl font-semibold">Failed to load data.</p>
            <p class="mt-2">This might be due to a Cross-Origin Resource Sharing (CORS) policy. Please try again or check the browser console for details.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const facultyContainer = document.getElementById('faculty-container');
            const loadingIndicator = document.getElementById('loading');
            const errorMessage = document.getElementById('error-message');
            const searchInput = document.getElementById('search-input');
            const departmentSelect = document.getElementById('department-select');
            const facultyCount = document.getElementById('faculty-count');

            const urls = [
                "https://www.amrita.edu/faculty/?cmp=45",
                ...Array.from({ length: 7 }, (_, i) => `https://www.amrita.edu/faculty/page/${i + 2}/?cmp=45`)
            ];

            let allFaculty = [];
            let departments = new Set();

            // A helper function to parse HTML string into a Document object
            const parseHtml = (htmlString) => {
                const parser = new DOMParser();
                return parser.parseFromString(htmlString, 'text/html');
            };

            // Function to extract a simplified department name
            const extractDepartment = (designation) => {
                const regex = /(Department of [^|]+?)(?=,|$)/;
                const match = designation.match(regex);
                if (match) {
                    const dept = match[1].trim().replace(/\s*,\s*$/, '').trim();
                    const simplified = dept.replace(/^(Department of )/, '').trim();
                    return simplified.length > 30 ? simplified.substring(0, 30) + '...' : simplified;
                }
                return 'Other';
            };

            const scrapeFaculty = async () => {
                for (const url of urls) {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        const html = await response.text();
                        const doc = parseHtml(html);

                        const facultyItems = doc.querySelectorAll('.fc-item');

                        facultyItems.forEach(item => {
                            const nameElement = item.querySelector('h6 a');
                            const designationElement = item.querySelector('p');
                            const imageElement = item.querySelector('.fc-image img');
                            const linkElement = item.querySelector('.fc-image a');

                            const name = nameElement ? nameElement.textContent.trim() : 'Name not found';
                            const designation = designationElement ? designationElement.textContent.trim() : 'Designation not found';
                            const department = extractDepartment(designation);
                            const imageUrl = imageElement ? imageElement.getAttribute('src') : 'https://placehold.co/112x112/e5e7eb/4b5563?text=No+Image';
                            const profileUrl = linkElement ? linkElement.href : '#';

                            allFaculty.push({ name, designation, imageUrl, department, profileUrl });
                            departments.add(department);
                        });
                    } catch (e) {
                        console.error(`Error scraping ${url}:`, e);
                    }
                }
            };

            const renderFilters = () => {
                const sortedDepartments = Array.from(departments).sort();
                sortedDepartments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept;
                    option.textContent = dept;
                    departmentSelect.appendChild(option);
                });
            };

            const displayFaculty = (facultyToDisplay) => {
                facultyContainer.innerHTML = '';
                if (facultyToDisplay.length === 0) {
                    facultyContainer.innerHTML = '<p class="text-center text-gray-500 text-lg col-span-full mt-8">No faculty found matching your criteria.</p>';
                    facultyCount.textContent = '0 members found';
                    return;
                }

                facultyToDisplay.forEach(faculty => {
                    const cardLink = document.createElement('a');
                    cardLink.href = faculty.profileUrl;
                    cardLink.target = "_blank"; // Open in a new tab
                    cardLink.classList.add('faculty-card', 'bg-white', 'rounded-xl', 'shadow-md', 'p-6', 'flex', 'flex-col', 'items-center', 'text-center', 'transform', 'hover:scale-105', 'transition-all', 'duration-300', 'ease-in-out');

                    const image = document.createElement('img');
                    image.src = faculty.imageUrl;
                    image.alt = faculty.name;
                    image.classList.add('w-28', 'h-28', 'object-cover', 'rounded-full', 'mb-4', 'shadow-md');
                    image.onerror = function() {
                        this.onerror = null;
                        this.src = 'https://placehold.co/112x112/e5e7eb/4b5563?text=No+Image';
                    };

                    const name = document.createElement('h3');
                    name.classList.add('text-lg', 'font-semibold', 'text-gray-800', 'mb-1');
                    name.textContent = faculty.name;

                    const designation = document.createElement('p');
                    designation.classList.add('text-sm', 'text-gray-500', 'mb-2');
                    designation.textContent = faculty.designation;

                    const departmentBadge = document.createElement('span');
                    departmentBadge.classList.add('bg-blue-100', 'text-blue-800', 'text-xs', 'font-medium', 'px-2.5', 'py-0.5', 'rounded-full');
                    departmentBadge.textContent = faculty.department;

                    cardLink.appendChild(image);
                    cardLink.appendChild(name);
                    cardLink.appendChild(designation);
                    cardLink.appendChild(departmentBadge);
                    facultyContainer.appendChild(cardLink);
                });
                facultyCount.textContent = `${facultyToDisplay.length} members found`;
            };

            const filterAndSearch = () => {
                const searchTerm = searchInput.value.toLowerCase();
                const selectedDepartment = departmentSelect.value;

                const filteredFaculty = allFaculty.filter(faculty => {
                    const matchesSearch = faculty.name.toLowerCase().includes(searchTerm) ||
                                          faculty.designation.toLowerCase().includes(searchTerm) ||
                                          faculty.department.toLowerCase().includes(searchTerm);
                    const matchesDepartment = selectedDepartment === 'all' || faculty.department === selectedDepartment;
                    return matchesSearch && matchesDepartment;
                });

                displayFaculty(filteredFaculty);
            };

            // Event Listeners
            searchInput.addEventListener('input', filterAndSearch);
            departmentSelect.addEventListener('change', filterAndSearch);

            // Main execution logic
            await scrapeFaculty();
            loadingIndicator.classList.add('hidden');
            if (allFaculty.length > 0) {
                renderFilters();
                displayFaculty(allFaculty);
            } else {
                errorMessage.classList.remove('hidden');
            }
        });
    </script>

</body>
</html>
